{% extends 'base.html'%}

{% block start %}
<div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
<h1>Login Form</h1>
<form class="col-md-6 col-lg-4" method="post" id="form">
  {% csrf_token %}
  <div class="form-group ">
    <label for="username">Username</label>
    <input type="text" name="user_name" class="form-control" id="username" aria-describedby="emailHelp" placeholder="Enter username">
    <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" name="password" class="form-control" placeholder="Enter password" id="password">
  </div>
  <p class="mt-2">Dont have an account <a href="{% url 'register'%}">Register</a></p>
  <button type="submit" class="btn btn-primary mt-2">Login</button>
</form>
</div>
{% endblock %}
