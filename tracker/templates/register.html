{% extends 'base.html'%}

{% block start %}
<div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
<h1>Registration Form</h1>
<form class="col-md-6 col-lg-4" method="post" id="form">
    {% csrf_token %}
    <div class="form-group ">
    <label for="first_name">First Name</label>
    <input type="text" name="first_name" class="form-control" id="first_name" aria-describedby="firstname" placeholder="Enter FirstName">
  </div>
  <div class="form-group ">
    <label for="lastname">Last Name</label>
    <input type="text" name="last_name" class="form-control" id="lastname" aria-describedby="lastname" placeholder="Enter LastName">
  </div>
  <div class="form-group ">
    <label for="username">Username</label>
    <input type="text" name="user_name" class="form-control" id="username" aria-describedby="emailHelp" placeholder="Enter username">
    <small id="emailHelp" name="username" class="form-text text-muted">We'll never share your email with anyone else.</small>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" name="password" class="form-control" id="password" placeholder="Enter password">
  </div>
  <p class="mt-2">Already have an account <a href="{% url 'login'%}">login</a></p>
  <button type="submit" class="btn btn-primary mt-2">Register</button>
</form>
</div>
{% endblock %}
