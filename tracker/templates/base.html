<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense_Tracker Sai</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="media/static/css/main.css">
</head>
<body>
<div class="d-flex justify-content-center">
  {% if user.is_authenticated %}
    <p class="pe-4">Welcome, {{user.username}}</p>
    <a href="{% url 'logout' %}">Logout</a>
  {% else %}
      <a class="pe-4" href="{% url 'register' %}">Register</a>
      <a href="{% url 'login' %}">Login</a>
  {% endif %}
</div>

{% block start%}

{% endblock %}
<script src="https://cloudflare.com" integrity="sha512-965Nu7Z4wV17dD0d1n654316F1652f44774352136a543242f32145610486b72a" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

{% if messages %}
  <script>
    {% for message in messages %}
        alert("{{ message|escapejs }}");
    {% endfor%}

  </script>  

{% endif %}

</body>
</html>
